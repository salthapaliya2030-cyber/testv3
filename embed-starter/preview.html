<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>local preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; color: #f1f0fa; background: radial-gradient(circle at 20% 10%, #30234d, transparent 42%), #11111a; font: 16px/1.6 Inter, ui-sans-serif, system-ui, sans-serif; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid #ffffff20; border-radius: 22px; background: #ffffff08; text-align: center; }
    .mark { width: 58px; height: 58px; margin: 0 auto 18px; }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 40px); letter-spacing: -.05em; }
    p { margin: 0; color: #aaa8bc; }
    code { color: #c5a7ff; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/stuff/logo.png" alt="">
    <h1>your local preview works.</h1>
    <p>this page is served from the same project and loaded in a sandboxed iframe. replace it with an authorized page you control.</p>
  </main>
</body>
</html>
